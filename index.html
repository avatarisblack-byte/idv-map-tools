<!DOCTYPE html>
<html lang="zh-CN" class="md3-light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>第五人格 · 密码机刷点推导工具</title>
  <link rel="stylesheet" href="src/styles/md3-tokens.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- ============ 侧边栏：地图菜单 ============ -->
    <aside class="sidebar is-collapsed" id="sidebar">
      <div class="sidebar-scroll">
      <div class="brand">
        <h1 class="brand-title">
          <span class="brand-text">密码机刷点</span>
          <svg class="brand-icon" viewBox="0 0 1024 1024" aria-hidden="true" focusable="false">

          </svg>
        </h1>
      </div>
      <nav class="map-menu">
        <div class="menu-title">选择地图</div>
        <div id="mapMenu" class="map-menu-list"></div>
      </nav>
      <div class="sidebar-foot">坐标数据 · BWIKI 第五人格</div>
      </div>
      <button id="sidebarToggle" class="sidebar-toggle" type="button" title="打开地图菜单" aria-expanded="false" aria-controls="sidebar" aria-label="打开 / 收起地图菜单"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M10 5l6 7-6 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </aside>

    <!-- 抽屉遮罩层：展开时覆盖主区，点击自动收起 -->
    <div id="drawerBackdrop" class="drawer-backdrop"></div>

    <!-- ============ 主区 ============ -->
    <main class="main">

      <!-- 顶部状态面板 -->
      <header class="status-panel">
        <div class="status-left">
          <span class="status-label">剩余匹配刷点方案</span>
          <span class="status-number" id="remainingCount">—</span>
          <span class="status-unit">组</span>
        </div>
        <div class="status-right">
          <button id="confirmLayoutBtn" class="confirm-layout-btn" type="button" disabled>确认布局</button>
          <button id="zoomOutBtn" class="icon-btn" type="button" title="缩小" aria-label="缩小">−</button>
          <button id="zoomFitBtn" class="icon-btn" type="button" title="适应窗口" aria-label="适应窗口">⛶</button>
          <button id="zoomInBtn" class="icon-btn" type="button" title="放大" aria-label="放大">＋</button>
          <button id="resetBtn" class="reset-btn" type="button">↺ 重置</button>
        </div>
      </header>

      <!-- 工作区：画布（自适应主区） -->
      <div class="workspace">
        <!-- 地图画布 -->
        <section class="map-frame">
          <div class="map-wrap" id="mapWrap">
            <canvas id="mapCanvas"></canvas>
            <div class="map-title" id="mapTitle">
              <svg class="map-title-icon" viewBox="0 0 1024 1024" aria-hidden="true" focusable="false">
                <path d="M512 928c-162.112 0-352-292.928-352-480 0-203.584 152.32-352 352-352s352 148.416 352 352c0 187.072-189.888 480-352 480v64c204.736 0 416-325.888 416-544C928 208.64 746.624 32 512 32S96 208.64 96 448c0 218.112 211.264 544 416 544v-64z" fill="currentColor"/>
                <path d="M512 608a160 160 0 1 1 0-320 160 160 0 0 1 0 320z m0-64a96 96 0 1 0 0-192 96 96 0 0 0 0 192z" fill="currentColor"/>
              </svg>
              <span id="mapTitleText">—</span>
            </div>
            <div id="mapTooltip" class="map-tooltip hidden"></div>
            <div id="mapLoading" class="map-loading">加载地图数据…</div>
          </div>
        </section>
      </div>
      <div class="brush-hint" id="brushHint">点击点位 = 状态轮换（右键 / 长按 = 回退）</div>

      <footer class="app-footer">
        每局密码机共 <b>7 台</b>，按固定刷点组 <b>7 选 7</b> 锁定唯一方案。<br />
        点亮 <b>5 台</b> 即可开门逃生（最多 5 台）。<br />
        <b>★</b>=必刷点 · 选中「有密码机」自动联动（高亮伴生、置灰互斥、更新匹配组）。<br />
        滚轮缩放 · 拖拽平移 · 点击切换状态（右键回退）· 悬停查看联动关系。
        <div class="footer-actions">
          <button id="restartTourBtn" class="restart-tour-btn" type="button">🎓 新手引导</button>
          <a class="restart-tour-btn" href="https://wiki.biligame.com/dwrg/%E9%A6%96%E9%A1%B5?hmsr=tag15&hmpl=&hmcu=&hmkw=&hmci=&spm_id_from=333.337.0.0" target="_blank" rel="noopener"><svg viewBox="0 0 1024 1024" aria-hidden="true" focusable="false"><path d="M777.514667 131.669333a53.333333 53.333333 0 0 1 0 75.434667L728.746667 255.829333h49.92A160 160 0 0 1 938.666667 415.872v320a160 160 0 0 1-160 160H245.333333A160 160 0 0 1 85.333333 735.872v-320a160 160 0 0 1 160-160h49.749334L246.4 207.146667a53.333333 53.333333 0 0 1 75.392-75.434667l113.152 113.152c3.370667 3.370667 6.186667 7.04 8.448 10.965333h137.088c2.261333-3.925333 5.12-7.68 8.490667-11.008l113.109333-113.152a53.333333 53.333333 0 0 1 75.434667 0z m1.152 231.253334H245.333333a53.333333 53.333333 0 0 0-53.205333 49.365333l-0.128 4.010667v320c0 28.117333 21.76 51.114667 49.365333 53.162666l3.968 0.170667h533.333334a53.333333 53.333333 0 0 0 53.205333-49.365333l0.128-3.968v-320c0-29.44-23.893333-53.333333-53.333333-53.333334z m-426.666667 106.666666c29.44 0 53.333333 23.893333 53.333333 53.333334v53.333333a53.333333 53.333333 0 1 1-106.666666 0v-53.333333c0-29.44 23.893333-53.333333 53.333333-53.333334z m320 0c29.44 0 53.333333 23.893333 53.333333 53.333334v53.333333a53.333333 53.333333 0 1 1-106.666666 0v-53.333333c0-29.44 23.893333-53.333333 53.333333-53.333334z" fill="currentColor"/></svg> Bilibili Wiki</a>
          <a class="restart-tour-btn" href="https://github.com/avatarisblack-byte/idv-map-tools" target="_blank" rel="noopener"><svg viewBox="0 0 1024 1024" aria-hidden="true" focusable="false"><path d="M511.542857 14.057143C228.914286 13.942857 0 242.742857 0 525.142857 0 748.457143 143.2 938.285714 342.628571 1008c26.857143 6.742857 22.742857-12.342857 22.742858-25.371429v-88.571428c-155.085714 18.171429-161.371429-84.457143-171.771429-101.6C172.571429 756.571429 122.857143 747.428571 137.714286 730.285714c35.314286-18.171429 71.314286 4.571429 113.028571 66.171429 30.171429 44.685714 89.028571 37.142857 118.857143 29.714286 6.514286-26.857143 20.457143-50.857143 39.657143-69.485715-160.685714-28.8-227.657143-126.857143-227.657143-243.428571 0-56.571429 18.628571-108.571429 55.2-150.514286-23.314286-69.142857 2.171429-128.342857 5.6-137.142857 66.4-5.942857 135.428571 47.542857 140.8 51.771429 37.714286-10.171429 80.8-15.542857 129.028571-15.542858 48.457143 0 91.657143 5.6 129.714286 15.885715 12.914286-9.828571 76.914286-55.771429 138.628572-50.171429 3.314286 8.8 28.228571 66.628571 6.285714 134.857143 37.028571 42.057143 55.885714 94.514286 55.885714 151.2 0 116.8-67.428571 214.971429-228.571428 243.314286a145.714286 145.714286 0 0 1 43.542857 104v128.571428c0.914286 10.285714 0 20.457143 17.142857 20.457143 202.4-68.228571 348.114286-259.428571 348.114286-484.685714 0-282.514286-229.028571-511.2-511.428572-511.2z" fill="currentColor"/></svg> GitHub</a>
        </div>
      </footer>
    </main>

    <!-- 右侧控制栏：全高通顶（图例 + 刷点方案） -->
    <aside class="right-panel" id="rightPanel">
      <button id="themeToggle" class="icon-btn" type="button" title="切换到深色模式" aria-label="切换到深色模式" aria-pressed="false"></button>
      <div class="panel" id="legendPanel">
        <h2>状态图例 <span class="panel-sub">点击图例设为「画笔」</span></h2>
        <div id="legend" class="legend"></div>
      </div>
      <div class="panel">
        <h2>刷点方案 <span class="panel-sub">悬停预览点位分布</span></h2>
        <div id="presetList" class="preset-list"></div>
      </div>
    </aside>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
